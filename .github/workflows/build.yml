name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export APK
        run: |
          mkdir -v -p build
          godot --headless --export-debug "Android" build/tirta.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tirta-apk
          path: build/tirta.apk
